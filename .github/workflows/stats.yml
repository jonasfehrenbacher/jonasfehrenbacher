name: Update GitHub Profile Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=jonasfehrenbacher&show_icons=true&theme=calm&rank_icon=github&include_all_commits=true&custom_title=Jonas%27s%20Stats&disable_animations=true&number_format=long&show=prs_merged_percentage,prs_reviewed"
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=jonasfehrenbacher&layout=compact&theme=calm&langs_count=8"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update profile statistics"
            git push
          fi
